{% extends "base.html" %}
{% block title %}Not Found — Aximove{% endblock %}

{% block content %}
<section class="max-w-xl mx-auto px-4 py-24 text-center">
  <p class="text-7xl sm:text-8xl font-black text-orange-500 tracking-tight">404</p>
  <h1 class="mt-4 text-2xl sm:text-3xl font-extrabold uppercase tracking-wide text-white">Page Not Found</h1>
  <p class="mt-3 text-gray-400">
    The page you're looking for doesn't exist or may have been moved.
  </p>
  <a href="{{ url_for('main.index') }}"
     class="inline-block mt-8 bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 transition text-white font-bold uppercase tracking-wider px-8 py-3 rounded-2xl shadow-lg shadow-orange-500/30">
    Back to Home
  </a>
</section>
{% endblock %}
