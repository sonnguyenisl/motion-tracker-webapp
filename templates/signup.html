{% extends "base.html" %}
{% block title %}Sign Up — Aximove{% endblock %}

{% block content %}
<section class="flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-extrabold uppercase tracking-wide text-white">Join the Movement</h2>
      <p class="text-gray-500 text-sm mt-2">Start your transformation today.</p>
    </div>

    {% if message %}
      <div class="p-3 mb-4 rounded-xl text-sm text-center font-semibold
                  {% if message_type == 'success' %}bg-green-500/10 border border-green-500/40 text-green-400
                  {% else %}bg-red-500/10 border border-red-500/40 text-red-400{% endif %}">
        {{ message }}
      </div>
    {% endif %}

    <form id="signupForm" action="{{ url_for('main.signup') }}" method="post" class="space-y-4">
      <input type="text" name="contact" placeholder="Email or Phone" required
        class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">

      <input type="text" name="username" placeholder="Username" required
        class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">

      <input type="password" id="password" name="password" placeholder="Password" required
        class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">

      <input type="password" id="repeat_password" name="repeat_password" placeholder="Repeat Password" required
        class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition">

      <div class="space-y-3">
        <div class="flex items-center gap-3">
          <img id="captchaImg" src="{{ url_for('main.captcha_image') }}" alt="captcha"
               class="h-14 rounded-xl border border-gray-700 bg-gray-800">
          <button type="button" id="captchaRefresh"
            class="text-xs font-bold uppercase tracking-wider text-orange-400 hover:text-orange-300 transition">
            Refresh
          </button>
        </div>
        <input type="text" name="captcha" placeholder="Type the characters above" autocomplete="off" required
          class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition uppercase tracking-widest">
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 p-3 rounded-xl font-bold uppercase tracking-wider text-white transition shadow-lg shadow-orange-500/30">
        Create Account
      </button>

      <a href="{{ url_for('main.login') }}"
         class="block w-full text-center mt-2 border border-gray-700 hover:border-orange-500 hover:text-orange-400 p-3 rounded-xl font-semibold text-gray-300 transition">
        Sign In
      </a>

      <p id="msg" class="text-sm text-center text-red-400"></p>
    </form>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("captchaRefresh").addEventListener("click", () => {
    document.getElementById("captchaImg").src = "{{ url_for('main.captcha_image') }}?t=" + Date.now();
  });

  document.getElementById("signupForm").addEventListener("submit", function (e) {
    const pass = document.getElementById("password").value;
    const repeat = document.getElementById("repeat_password").value;
    const msg = document.getElementById("msg");
    if (pass !== repeat) {
      e.preventDefault();
      msg.innerText = "Passwords do not match";
      return;
    }
    msg.innerText = "";
  });
</script>
{% endblock %}
